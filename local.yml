version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres
    env_file:
      - compose/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lms-network

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms-network

  backend:
    build:
      context: .
      dockerfile: compose/Dockerfile
    container_name: lms-backend
    env_file:
      - compose/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - lms-network

  frontend:
    build:
      context: .
      dockerfile: compose/Dockerfile.frontend
    container_name: lms-frontend
    volumes:
      - ./library-ui:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - lms-network

volumes:
  postgres_data:
  redis_data:
  node_modules:

networks:
  lms-network:
    driver: bridge
